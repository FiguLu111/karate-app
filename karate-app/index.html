<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rutina de karate</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1d2a4d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Karate">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{--bg:#f3f4f7;--card:#fff;--ink:#141a28;--mute:#667086;--line:#e1e4ec;--ind:#1d2a4d;--ind2:#2f4278;--red:#c62828;--ok:#1f8a5b;--chip:#eceff6;
box-sizing:border-box;padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1017;--card:#161b26;--ink:#eef1f7;--mute:#98a2b6;--line:#262d3d;--ind:#162043;--ind2:#26346a;--red:#ef5350;--ok:#4cc38a;--chip:#212839}}
:root[data-theme="dark"]{--bg:#0d1017;--card:#161b26;--ink:#eef1f7;--mute:#98a2b6;--line:#262d3d;--ind:#162043;--ind2:#26346a;--red:#ef5350;--ok:#4cc38a;--chip:#212839}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.hero{position:relative;overflow:hidden;background:linear-gradient(160deg,var(--ind2),var(--ind));color:#fff;padding:calc(env(safe-area-inset-top,0px) + 22px) 20px 26px}
.hero::after{content:"空";position:absolute;right:-18px;bottom:-62px;font-size:210px;line-height:1;opacity:.07;font-family:"Hiragino Mincho ProN","Noto Serif JP",serif;pointer-events:none}
.hero-in{max-width:640px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:16px;position:relative;z-index:1}
.hero h1{font-size:2.1rem;font-weight:800;letter-spacing:-.03em;line-height:1.05;margin:0}
.hero p{margin:4px 0 12px;opacity:.75;font-size:.95rem}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{background:rgba(255,255,255,.14);border-radius:999px;padding:3px 11px;font-size:.8rem}
.chips .alert{background:var(--red);color:#fff}
.ring{width:92px;height:92px;flex:none;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:8}
.ring .bg{stroke:rgba(255,255,255,.18)}
.ring .fg{stroke:#fff;stroke-linecap:round;transition:stroke-dashoffset .5s ease}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:1.2rem}
.week{max-width:640px;margin:-18px auto 0;padding:0 12px;display:grid;grid-template-columns:repeat(7,1fr);gap:6px;position:relative;z-index:2}
.week button{border:0;background:var(--card);color:var(--ink);border-radius:14px;padding:8px 0 10px;font:inherit;box-shadow:0 2px 8px rgba(10,20,50,.12);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.week small{color:var(--mute);font-size:.7rem}
.week strong{font-size:1.05rem}
.week i{width:6px;height:6px;border-radius:50%;background:transparent}
.week .some i{background:var(--mute)}.week .full i{background:var(--ok)}
.week .on{background:var(--ind2);color:#fff}.week .on small{color:#ffffffb0}.week .on .full i,.week .on .some i{background:#fff}
.week .hoy strong{text-decoration:underline;text-underline-offset:3px}
main{max-width:640px;margin:0 auto;padding:18px 14px 28px}
.block{margin-bottom:18px}
.block h2{display:flex;justify-content:space-between;font-size:.95rem;font-weight:700;margin:0 4px 8px}
.block h2 em{font-style:normal;color:var(--mute);font-weight:500}
.block.fin h2 em{color:var(--ok)}
.list{background:var(--card);border-radius:16px;overflow:hidden;box-shadow:0 1px 3px rgba(10,20,50,.08)}
.item{padding:13px 14px;border-top:1px solid var(--line);display:flex;gap:12px;cursor:pointer}
.item:first-child{border-top:0}
.chk{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--line);background:transparent;display:grid;place-items:center;padding:0;cursor:pointer;transition:background .15s,border-color .15s}
.chk svg{width:16px;height:16px;fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:22;stroke-dashoffset:22;transition:stroke-dashoffset .2s}
.done .chk{background:var(--ok);border-color:var(--ok)}.done .chk svg{stroke-dashoffset:0}
.body{flex:1;min-width:0}
.top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.n{font-weight:600}
.done .n{color:var(--mute);text-decoration:line-through}
.sr{flex:none;background:var(--chip);border-radius:8px;padding:1px 9px;font-size:.82rem;font-weight:600}
.sr.low{background:var(--red);color:#fff}
.more{display:none;margin-top:8px}.open .more{display:block}
.d{color:var(--mute);font-size:.88rem;margin-bottom:8px}
.more input{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:9px 11px;font:inherit;font-size:.92rem}
.test{background:var(--card);border-left:4px solid var(--red);border-radius:12px;padding:12px 14px;margin-bottom:18px;font-size:.9rem}
details{margin-top:10px;background:var(--card);border-radius:14px;padding:12px 14px}
summary{cursor:pointer;font-weight:600}
.hist div{display:flex;justify-content:space-between;padding:6px 0;border-top:1px solid var(--line);font-size:.92rem}
input[type=date]{font:inherit;padding:6px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px}
</style>
</head>
<body>
<header class="hero"><div class="hero-in">
  <div><h1 id="hday"></h1><p id="hdate"></p><div class="chips" id="chips"></div></div>
  <div class="ring"><svg width="92" height="92" viewBox="0 0 92 92"><circle class="bg" cx="46" cy="46" r="38"/><circle class="fg" id="fg" cx="46" cy="46" r="38" stroke-dasharray="238.8" stroke-dashoffset="238.8"/></svg><b id="cnt"></b></div>
</div></header>
<nav class="week" id="tabs"></nav>
<main>
  <div id="day"></div>
  <details><summary>Historial</summary><div class="hist" id="hist"></div></details>
  <details><summary>Ajustes</summary><p><label>Inicio de la semana 1: <input type="date" id="start"></label></p></details>
</main>
<script>
/* ========= 1) DATOS: aquí vive tu rutina. Para editarla, cambia estas líneas. =========
   S(nombre, series, reps) = ejercicio con series (en semana de descarga 3 pasa a 2)
   N(nombre, detalle)      = ejercicio sin series (tiempo, lista de pasos, etc.) */
const S=(n,s,r)=>({n,s,r}), N=(n,d='')=>({n,d});
const CALENT=N('Calentamiento (10 min)','Trotar 5 vueltas · círculos de brazos 10+10 · rotación de cadera 10 por lado · zenkutsu-dachi dinámico 6 por pierna · balanceos 10+10 por pierna · banda: caminata lateral 2×10 y diagonal 2×10');
const RESP=N('Respiración o meditación (5 a 10 min)','Inhalar 4, exhalar 6. Meditación larga: asentarse 1 min, respiración 3, barrido del cuerpo 2, visualización 3, palabra clave 1');
const DAYS=[
 {name:'Domingo',blocks:[
  {t:'15:00–18:00 Descanso físico',items:[N('Elongación suave','15 min'),N('Animal movement','10 min'),N('Repasar la semana','30 min: completar progreso y anotar qué mejorar')]},
  {t:'18:00–20:00',items:[N('Estudiar y preparar la semana')]}]},
 {name:'Lunes',blocks:[
  {t:'16:30 Antes del dojo (30 min)',items:[
   N('Entrar en calor (5 min)','Trotar 5 vueltas · círculos de brazos 10+10 · rotación de cadera 10 por lado'),
   N('Movilidad (6 min)','Sentadillas 10 · zancadas 8 por pierna · balanceos 10+10 por pierna'),
   N('Banda (5 min)','Caminata lateral y diagonal, 2 series de 10 pasos'),
   N('Elongación (5 min)','Isquiotibiales, aductores, flexores de cadera: 2 repeticiones por lado de 5 respiraciones lentas'),
   N('Técnica suave: Jion','Lento, 2 veces con pausa de 2 s'),
   S('Kizami zuki',3,'10'),S('Gyaku zuki chudan',3,'10'),
   S('Patada lenta, sostenida 3 s arriba',2,'5 por pierna'),
   N('Cierre (2 min)','5 respiraciones (4-6), palabra clave, saludo')]},
  {t:'17:00–20:00',items:[N('Dojo')]},
  {t:'20:00–21:00',items:[N('Elongación para patadas altas (15 min)','Isquiotibiales sentado, mariposa, apertura lateral, zancada baja, figura 4: 2 repeticiones de 30 s por lado'),N('Lectura')]}]},
 {name:'Martes',blocks:[
  {t:'19:00–20:00',items:[N('Análisis de kumite (30 min)','1 competidor, 1 objetivo, 3 combates. Anotar 1 cosa para copiar y 1 para hacer distinto'),N('Repaso mental (5 min)')]},
  {t:'20:00–21:00',items:[N('Dojo')]}]},
 {name:'Miércoles',blocks:[
  {t:'17:00–19:00',items:[N('Dojo')]},
  {t:'19:00–20:00',items:[N('Elongación','10 min'),
   N('Animal movement (10 min)','10 círculos de muñeca · gateo de oso 2×(6 adelante y 6 atrás) · caminata de cangrejo 2×6 · mono viajero 2×6 · side kick-through 2×5 por lado'),
   N('Jion lento (20 min)','3 veces lento con pausa de 2 s y 2 veces a velocidad media')]}]},
 {name:'Jueves',blocks:[
  {t:'17:00–18:00 Sesión A (fuerza, sin saltos)',items:[CALENT,
   S('Sentadilla sin peso, bajando contando 3',3,'10'),
   S('Zancadas alternadas',3,'8 por pierna'),
   S('Puente de glúteos, pausa de 1 s arriba',3,'12'),
   S('Flexiones',3,'8 a 12'),
   S('Remo invertido bajo mesa firme (o dominadas)',3,'6 a 8'),
   S('Elevaciones de talón',3,'15'),
   S('Plancha frontal',3,'30 s'),S('Plancha lateral',3,'20 s por lado'),
   N('Enfriamiento y elongación','5 min')]},
  {t:'20:00–21:00',items:[N('Análisis de kata o kumite (30 min) y notas')]}]},
 {name:'Viernes',blocks:[
  {t:'16:00–17:00 Sesión B (pliometría y velocidad)',items:[
   N('Calentamiento y combos con banda','Banda ligera sobre las rodillas: kizami yoko geri y ura mawashi geri lentos, 2×5 por lado; sin banda, 2 veces rápido'),
   S('Sentadilla con salto (movida aquí desde el jueves)',3,'5, descanso 90 s'),
   S('Saltos verticales',3,'5, descanso 90 s'),
   S('Saltos laterales sobre una línea',3,'8'),
   S('Salto largo con aterrizaje controlado',3,'4'),
   N('Arranques de 3 a 5 m desde guardia, a tope','6 repeticiones'),
   S('Kizami con yori-ashi a máxima velocidad hacia un cojín',3,'5, descanso 60 a 90 s'),
   S('Flexiones rápidas',3,'6'),S('Lanzamientos de pelota',3,'6'),
   N('Escalera de agilidad (6 a 8 cuadros de ~40 cm)','2 pasadas con un pie por cuadro y 2 entrando y saliendo con los dos pies'),
   N('Kumite en sombra','6 rondas de 1 min, descanso 30 s'),
   N('Intervalos de sombra (4 min)','8 rondas de 20 s a tope y 10 s suave'),
   N('Enfriamiento y elongación','5 min')]},
  {t:'19:00–20:00',items:[N('Jion a velocidad real (20 a 30 min)','3 veces con kime y kiai. Grabar la última y anotar 1 corrección')]}]},
 {name:'Sábado',blocks:[
  {t:'11:00–13:00',items:[N('Dojo')]},
  {t:'Desde las 15:00',items:[N('Kata técnico (30 min)','Jion corrigiendo lo anotado, 2 movimientos difíciles por separado 10 veces cada uno, una pasada completa'),N('Análisis largo','1 hora')]}]}
];
const TESTS='Pruebas de esta semana: salto vertical (cm) · flexiones en 1 min · plancha frontal (s) · arranque de 5 m (s) · altura de patada · Jion grabado (3 cosas por mejorar)';

/* ========= 2) ESTADO: se guarda en localStorage del navegador ========= */
const KEY='karate_v1';
let st={}; try{st=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){}
const iso=d=>d.toLocaleDateString('sv');
st.start=st.start||iso(new Date()); st.log=st.log||{};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}};
const today=new Date().getDay();
let sel=today; const abiertos=new Set();

/* ========= 3) CÁLCULOS: semana, fase, descarga ========= */
function semana(){
  const dias=Math.floor((new Date(iso(new Date()))-new Date(st.start))/864e5);
  const wk=Math.max(1,Math.floor(dias/7)+1);
  const fase=wk<=4?'Base':wk<=8?'Fuerza y potencia':wk<=12?'Específica':'Afinación';
  return {wk,fase,descarga:wk%4===0};
}
function fechaDe(d){const f=new Date(); f.setDate(f.getDate()+(d-f.getDay())); return iso(f)}
const bonito=f=>new Date(f+'T12:00').toLocaleDateString('es-CL',{day:'numeric',month:'long'});
const bloquesDe=d=>[...DAYS[d].blocks,{t:'Todos los días',items:[RESP]}];
const totalDe=d=>bloquesDe(d).reduce((n,b)=>n+b.items.length,0);
const hechosDe=f=>Object.values(st.log[f]||{}).filter(x=>x.ok).length;

/* ========= 4) PANTALLA ========= */
const CHECK='<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
function render(){
  const {wk,fase,descarga}=semana();
  const fecha=fechaDe(sel), reg=st.log[fecha]||{}, total=totalDe(sel), hechos=hechosDe(fecha);
  hday.textContent=DAYS[sel].name;
  hdate.textContent=(sel===today?'Hoy · ':'')+bonito(fecha);
  chips.innerHTML=`<span>Semana ${wk}</span><span>${fase}</span>`+(descarga?'<span class="alert">Descarga: 2 series</span>':'');
  document.getElementById('fg').style.strokeDashoffset=238.8*(1-(total?hechos/total:0));
  cnt.textContent=`${hechos}/${total}`;
  tabs.innerHTML=L.map((l,i)=>{
    const f=fechaDe(i), h=hechosDe(f), c=h>=totalDe(i)?'full':h?'some':'';
    return `<button class="${c} ${i===sel?'on':''} ${i===today?'hoy':''}" data-d="${i}"><small>${l}</small><strong>${+f.slice(8)}</strong><i></i></button>`}).join('');
  let html=descarga?`<div class="test"><b>Semana de pruebas.</b><br>${TESTS}</div>`:'';
  bloquesDe(sel).forEach((b,bi)=>{
    const h=b.items.filter((_,ii)=>reg[bi+'-'+ii]?.ok).length;
    html+=`<section class="block ${h===b.items.length?'fin':''}"><h2>${b.t}<em>${h}/${b.items.length}</em></h2><div class="list">`;
    b.items.forEach((it,ii)=>{
      const id=bi+'-'+ii, r=reg[id]||{}, k=sel+':'+id;
      const n=it.s?(descarga&&it.s===3?2:it.s):0;
      const chip=it.s?`<span class="sr ${n!==it.s?'low':''}">${n} × ${it.r.split(',')[0]}</span>`:'';
      const det=it.s&&it.r.includes(',')?it.r.split(',').slice(1).join(',').trim():(it.d||'');
      html+=`<div class="item ${r.ok?'done':''} ${abiertos.has(k)?'open':''}" data-k="${k}">
        <button class="chk" data-id="${id}" aria-label="Marcar como hecho">${CHECK}</button>
        <div class="body"><div class="top"><span class="n">${it.n}</span>${chip}</div>
        <div class="more">${det?`<div class="d">${det}</div>`:''}<input type="text" data-note="${id}" placeholder="Lo que hice (ej. 3×10, 45 s)" value="${r.note||''}"></div></div></div>`;
    });
    html+='</div></section>';
  });
  day.innerHTML=html;
  const fechas=Object.keys(st.log).sort().reverse().slice(0,14).filter(f=>hechosDe(f)>0);
  hist.innerHTML=fechas.map(f=>`<div><span>${bonito(f)}</span><b>${hechosDe(f)} ejercicios</b></div>`).join('')||'<div>Aún no marcaste nada.</div>';
  start.value=st.start;
}

/* ========= 5) EVENTOS ========= */
const L=['D','L','M','M','J','V','S'];
tabs.onclick=e=>{const b=e.target.closest('button');if(b){sel=+b.dataset.d;render()}};
day.onclick=e=>{
  if(e.target.closest('input')) return;
  const chk=e.target.closest('.chk');
  if(chk){
    const f=fechaDe(sel), id=chk.dataset.id;
    st.log[f]=st.log[f]||{}; st.log[f][id]=st.log[f][id]||{};
    st.log[f][id].ok=!st.log[f][id].ok; save();
    if(st.log[f][id].ok&&navigator.vibrate) navigator.vibrate(15);
    render(); return;
  }
  const it=e.target.closest('.item'); if(!it) return;
  const k=it.dataset.k; abiertos.has(k)?abiertos.delete(k):abiertos.add(k);
  it.classList.toggle('open');
};
day.oninput=e=>{
  const id=e.target.dataset.note; if(id===undefined) return;
  const f=fechaDe(sel); st.log[f]=st.log[f]||{}; st.log[f][id]=st.log[f][id]||{};
  st.log[f][id].note=e.target.value; save();
};
start.onchange=()=>{st.start=start.value||st.start;save();render()};
render();
/* ========= 6) APP INSTALABLE: el service worker guarda los archivos para que abra sin internet ========= */
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
